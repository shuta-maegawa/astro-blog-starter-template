name: Tmp Branch Auto Comment

on:
  pull_request:
    types: [opened]

jobs:
  check-and-comment:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'tmp/')

    permissions:
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add comment for tmp branch
        uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = require('url');
            const scriptFile = `${process.env.GITHUB_WORKSPACE}/.github/workflows/scripts/check-tmp-branch-comment.js`;
            const { default: script } = await import(pathToFileURL(scriptFile).href);
            await script({ github, context });
